name: CI 构建守门

# 守门策略：任何 push/PR 到主分支都必须通过
# 1. flutter analyze（静态分析，error 阻断）
# 2. flutter test（契约/单元测试，失败阻断）
# 3. flutter build apk --release（构建失败阻断）
# 任一环节失败即阻断合并与发布。

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: 构建守门（analyze + test + apk）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # gradle.properties 中 org.gradle.java.home 指向开发者本机 JDK 路径，
      # 在 CI 环境不存在会导致 Gradle 启动失败，这里移除该行（仅影响 CI 工作区副本）。
      - name: 移除本机专用 gradle java.home 配置
        run: |
          sed -i '/org.gradle.java.home/d' android/gradle.properties
          echo "已移除 org.gradle.java.home，改用 CI 的 JAVA_HOME"

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 静态分析守门
        # 仅 error 阻断（warning/info 作为代码质量提示，不阻塞发布）
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 单元测试守门
        run: flutter test

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传 APK 制品
        uses: actions/upload-artifact@v4
        with:
          name: director-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14